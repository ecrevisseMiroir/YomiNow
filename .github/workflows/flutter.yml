name: Flutter CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      retrace:
        description: >-
          Obfuscated stack trace from the release APK. When set, the Android
          job deobfuscates it with this build's R8 mapping, and iOS is skipped.
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: flutter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.5"

jobs:
  linux:
    name: Linux (analyze, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies and Tesseract
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev tesseract-ocr xvfb

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: End-to-end test (OCR → tap → JMdict) on the Linux app
        run: xvfb-run -a flutter test integration_test -d linux
      - run: flutter build linux --release

  android:
    name: Android (release APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get
      # Signed with the debug key (see android/app/build.gradle.kts), so it
      # installs on any phone that allows apps from unknown sources.
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: yominow-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
      # R8 mapping, needed to retrace obfuscated stack traces from this APK.
      - uses: actions/upload-artifact@v4
        with:
          name: yominow-apk-mapping
          path: build/app/outputs/mapping/release/mapping.txt
          retention-days: 30
      # The mapping only fits an APK built from the same sources; compare the
      # printed pg_map_id with the r8-map-id in the stack trace.
      - name: Retrace the given stack trace
        if: inputs.retrace != ''
        env:
          STACKTRACE: ${{ inputs.retrace }}
        run: |
          mapping=build/app/outputs/mapping/release/mapping.txt
          grep -m1 pg_map_id "$mapping"
          printf '%s\n' "$STACKTRACE" > stacktrace.txt
          retrace=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/retrace' | head -n1)
          "$retrace" "$mapping" stacktrace.txt

  # macOS runners are expensive, so iOS only builds when triggered by hand.
  ios:
    name: iOS (debug, no codesign)
    if: github.event_name == 'workflow_dispatch' && inputs.retrace == ''
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get
      - run: flutter build ios --debug --no-codesign
