name: yominow
description: "Point your camera at Japanese text, tap a word, read it now."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  archive: ^4.0.0
  google_mlkit_text_recognition: ^0.17.1
  image: ^4.2.0
  image_picker: ^1.2.3
  kuromoji: ^1.0.5
  lucide_icons_flutter: ^3.1.20
  path: ^1.9.0
  path_provider: ^2.1.6
  sqlite3: ^3.6.0
  cross_file: ^0.3.5+5
  camera: ^0.12.1

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  http: ^1.2.0
  xml: ^6.5.0
  crypto: ^3.0.7

flutter:
  uses-material-design: true
  assets:
    - assets/tessdata/
    - assets/dict/
    - assets/02_brand_logo/logo_splash.png
    - assets/02_brand_logo/wordmark_splash.png
    - assets/04_scenery_backgrounds/splash_fuji_torii_scene.png
    - assets/03_characters_mascot/cat_home_face_notification.png
    - assets/04_scenery_backgrounds/background.png
    - assets/02_brand_logo/logo_about.png
    - assets/04_scenery_backgrounds/about-background.png
    - assets/04_scenery_backgrounds/loading.png
    - assets/03_characters_mascot/cat_empty_state.png
    - assets/03_characters_mascot/cat_error.png
    - assets/03_characters_mascot/cat_loading.png
  fonts:
    - family: NotoSansJP
      fonts:
        - asset: assets/fonts/NotoSansJP-Variable.ttf
          weight: 400
        - asset: assets/fonts/NotoSansJP-Variable.ttf
          weight: 500
        - asset: assets/fonts/NotoSansJP-Variable.ttf
          weight: 600
        - asset: assets/fonts/NotoSansJP-Variable.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 400
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 500
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 600
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 700
    - family: Fredoka
      fonts:
        - asset: assets/fonts/Fredoka-Variable.ttf
          weight: 400
        - asset: assets/fonts/Fredoka-Variable.ttf
          weight: 500
        - asset: assets/fonts/Fredoka-Variable.ttf
          weight: 600
        - asset: assets/fonts/Fredoka-Variable.ttf
          weight: 700

flutter_native_splash:
  color: "#FFF9F5"
  image: assets/02_brand_logo/logo_splash.png
  android: true
  ios: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/02_brand_logo/logo_brand_panel.png"
