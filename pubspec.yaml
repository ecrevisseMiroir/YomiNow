name: yominow
description: "Point your camera at Japanese text, tap a word, read it now."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  archive: ^4.0.0
  google_mlkit_text_recognition: ^0.17.1
  image: ^4.2.0
  image_picker: ^1.2.3
  kuromoji: ^1.0.5
  path: ^1.9.0
  path_provider: ^2.1.6
  sqlite3: ^3.6.0

dev_dependencies:
  lucide_icons_flutter: ^3.1.20
  flutter_native_splash: ^2.4.8
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  http: ^1.2.0
  xml: ^6.5.0
  crypto: ^3.0.7

flutter:
  uses-material-design: true
  assets:
    - assets/tessdata/
    - assets/dict/
    - assets/02_brand_logo/logo_splash.png
    - assets/02_brand_logo/wordmark_splash.png
    - assets/04_scenery_backgrounds/splash_fuji_torii_scene.png

flutter_native_splash:
  color: "#FFF9F5"
  image: assets/02_brand_logo/logo_splash.png
  android: true
  ios: true
